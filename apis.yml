aid: acv-auctions
name: ACV Auctions
description: 'ACV Auctions is a digital wholesale marketplace for the automotive industry,
  operating the leading online platform for dealer-to-dealer used-vehicle auctions
  across the United States. Franchise and independent dealers source and sell inventory
  through daily online auctions backed by third-party vehicle inspections, detailed
  condition reports, and the company''s data and analytics products. ACV also offers
  complementary services including vehicle transportation, dealer floor-plan financing
  through ACV Capital, and inventory-management and pricing tools. The company is publicly
  traded and headquartered in Buffalo, New York. It does not currently publish a public
  developer API or developer portal; this profile captures its public identity and
  security posture.'
